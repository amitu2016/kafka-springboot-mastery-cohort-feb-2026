# 3-node Kafka cluster (KRaft, combined broker+controller) + Kafdrop UI
#
# Host ports are chosen so they don't clash with the single-node demos in this repo
# (which use 9092/9093/9094 for Kafka and 9000 for Kafdrop):
#
#   kafka-1   -> localhost:19092
#   kafka-2   -> localhost:29092
#   kafka-3   -> localhost:39092
#   kafdrop   -> http://localhost:9100
#
# Spring Boot bootstrap servers: localhost:19092,localhost:29092,localhost:39092
#
# Inside the Docker network, containers talk on INTERNAL (port 9092) and the
# controller quorum on CONTROLLER (port 9093). Those ports are NOT published to the host.

x-kafka-common-env: &kafka-common-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
    INTERNAL:PLAINTEXT,
    EXTERNAL:PLAINTEXT,
    CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFKA_LOG_DIRS: /var/lib/kafka/data

  # Replication defaults for a 3-node cluster
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

services:
  kafka-1:
    image: apache/kafka:4.1.0
    container_name: kafka-cluster-1
    hostname: kafka-1
    ports:
      - "19092:19092"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: >
        INTERNAL://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:19092,
        CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka-1:9092,
        EXTERNAL://localhost:19092

  kafka-2:
    image: apache/kafka:4.1.0
    container_name: kafka-cluster-2
    hostname: kafka-2
    ports:
      - "29092:29092"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: >
        INTERNAL://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:29092,
        CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka-2:9092,
        EXTERNAL://localhost:29092

  kafka-3:
    image: apache/kafka:4.1.0
    container_name: kafka-cluster-3
    hostname: kafka-3
    ports:
      - "39092:39092"
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: >
        INTERNAL://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:39092,
        CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka-3:9092,
        EXTERNAL://localhost:39092

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafka-cluster-kafdrop
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    ports:
      - "9100:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SERVER_SERVLET_CONTEXTPATH: "/"
      JVM_OPTS: "-Xms32M -Xmx128M"

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
